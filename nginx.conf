server {
    listen 80;
    server_name _;

    # Built assets location
    root /usr/share/nginx/html;
    index index.html;

    # 1) APIs should be matched before SPA fallback (example, keep/extend if you have backend)
    # location /api/ {
    #     proxy_pass http://backend:8080/;
    # }

    # 2) Static assets: must not fallback; 404 when missing
    location ~* ^/(static|assets|favicon\.ico|manifest\.json|robots\.txt|sitemap\.xml) {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 3) SPA routes: fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Avoid long caching for the HTML shell
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
